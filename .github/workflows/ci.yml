name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'   # samakan dengan "require.php" di composer.json
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd   # gd: perkecil foto produk Toko
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm            # butuh package-lock.json yang ikut di-commit

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: vendor/bin/pint --test
      - run: npm ci
      - run: npm run build
      - run: php artisan test
